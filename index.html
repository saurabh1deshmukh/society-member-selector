<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Society Committee Selector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Society Committee Selector</h1>
      <p class="subtitle">Fair lottery prioritizing fresh owners, then shortest tenure</p>
    </header>

    <div class="layout">
      <!-- Left Panel: Owner Table & Config -->
      <section class="card">
        <div class="card-header">
          <h2>Owners &amp; Service History</h2>
          <button id="add-row-btn" class="btn btn-secondary">+ Add Owner</button>
        </div>

        <div class="table-container">
          <table id="owners-table">
            <thead>
              <tr>
                <th>Owner Name</th>
                <th>Years Served (e.g. 2021, 2023)</th>
                <th style="width: 50px;">Action</th>
              </tr>
            </thead>
            <tbody id="owners-tbody">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>

        <div class="controls-bar">
          <div class="input-group">
            <label for="required-count">Committee Size Needed:</label>
            <input type="number" id="required-count" min="1" value="3" />
          </div>
          <button id="submit-btn" class="btn btn-primary">Generate Committee</button>
        </div>
      </section>

      <!-- Right Panel: Selection Output -->
      <section class="card">
        <h2>Selected Committee</h2>
        <div id="results-meta" class="meta-info">Configure your owners and click "Generate Committee".</div>
        <ul id="results-list" class="results-list">
          <li class="empty-state">No selection made yet.</li>
        </ul>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
